# F1: Shopify Flow trigger. Merchants pick "Shipment at risk" as the start of a
# workflow (e.g. add order tag "delayed", post to Slack, create a ticket).
# Trigger field types allowed: boolean, email, single_line_text_field,
# number_decimal, url. Keys: letters and spaces only.
[[extensions]]
name = "Shipment at risk"
type = "flow_trigger"
handle = "shipment-at-risk"
description = "Starts when Delaywise finds a stalled, late, problem or probably lost shipment."

  [settings]

  [[settings.fields]]
  type = "order_reference"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Risk level"
  description = "stalled, delayed, exception or lost"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Reason"

  [[settings.fields]]
  type = "number_decimal"
  key = "Days late"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Carrier"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Tracking number"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "Tracking URL"
