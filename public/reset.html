<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a new password — MailPilot AI</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
  <div class="auth container">
    <a class="logo" href="/">Mail<span>Pilot</span> AI</a>
    <div class="card" style="margin-top:20px">
      <h2>Choose a new password</h2>
      <form id="auth-form" data-mode="reset">
        <label>New password</label><input name="password" type="password" minlength="8" required autocomplete="new-password">
        <div class="err-text" id="err"></div>
        <button class="btn primary block">Save password</button>
      </form>
    </div>
  </div>
  <script src="/js/auth.js"></script>
</body></html>
