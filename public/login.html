<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — MailPilot AI</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
  <div class="auth container">
    <a class="logo" href="/">Mail<span>Pilot</span> AI</a>
    <div class="card" style="margin-top:20px">
      <h2>Welcome back</h2>
      <form id="auth-form" data-mode="login">
        <label>Email</label><input name="email" type="email" required autocomplete="email">
        <label>Password</label><input name="password" type="password" required autocomplete="current-password">
        <div class="err-text" id="err"></div>
        <button class="btn primary" style="width:100%;margin-top:16px;justify-content:center">Log in</button>
      </form>
      <p class="hint">No account? <a href="/signup">Start a free trial</a></p>
    </div>
  </div>
  <script src="/js/auth.js"></script>
</body></html>
