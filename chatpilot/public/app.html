<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ChatPilot AI</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme-boot.js"></script>
</head>
<body>
  <div id="imp"></div>
  <div class="shell">
    <nav class="rail" id="rail" aria-label="Main">
      <a class="brand-mark" href="#dashboard" id="brand-mark" aria-label="ChatPilot AI home"></a>
      <div id="nav" style="display:contents"></div>
      <div class="rail-foot" id="rail-foot"></div>
    </nav>
    <div class="main">
      <header class="topbar">
        <div class="ws-chip"><b id="ws-name"></b><select id="ws-switch" aria-label="Switch shop" hidden></select><a class="plan-pill" id="plan-pill" href="#billing"></a></div>
        <span class="spacer"></span>
        <button class="search-trigger" id="search-trigger" type="button" aria-label="Search"><span id="search-icon"></span><span>Search customers, pages…</span><span class="k"><kbd>Ctrl</kbd> <kbd>K</kbd></span></button>
        <button class="btn ghost icon-only" id="bell-btn" aria-label="Notifications" title="Notifications" style="position:relative"></button>
        <button class="btn ghost icon-only" id="theme-btn" aria-label="Change theme" title="Theme"></button>
        <a class="btn ghost icon-only" href="#support" aria-label="Help" title="Help & support" id="help-btn"></a>
        <button class="btn ghost icon-only" id="user-btn" aria-label="Account menu"></button>
      </header>
      <div class="content" id="content">
        <div class="banner-zone" id="banners"></div>
        <div id="view"></div>
      </div>
    </div>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  <script src="/js/app.js" type="module"></script>
</body>
</html>
